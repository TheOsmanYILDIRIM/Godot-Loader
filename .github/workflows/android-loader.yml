name: Godot Loader Android
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag for draft prerelease (e.g. v0.1.0-rc1); leave blank for CI only'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-loader.yml'
permissions:
  contents: write
jobs:
  loader:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.6-stable
          path: .godot-engine
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot native build prerequisites
        run: |
          set -euo pipefail
          python3 -m pip install --user 'scons>=4.4,<5'
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709"
      - name: Patch Godot Android user data namespace per imported pack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.godot-engine/platform/android/java/lib/src/main/java/org/godotengine/godot/GodotIO.java')
          original=path.read_text()
          needle='''	public String getDataDir() {
		return getContext().getFilesDir().getAbsolutePath();
	}'''
          replacement='''	public String getDataDir() {
		Context context = getContext();
		if (context instanceof Activity) {
			String pack = ((Activity)context).getIntent().getStringExtra("com.osman.godotloader.PACK");
			if (pack != null) {
				if (!pack.matches("[0-9a-f]{64}\\\\.pck")) {
					throw new IllegalStateException("Invalid external pack identity");
				}
				File profile = new File(context.getFilesDir(), "profiles/" + pack.substring(0, 64));
				if (!profile.isDirectory() && !profile.mkdirs()) {
					throw new IllegalStateException("Unable to create per-pack save directory");
				}
				return profile.getAbsolutePath();
			}
		}
		return context.getFilesDir().getAbsolutePath();
	}'''
          assert original.count(needle)==1,'Godot 4.6 source changed, refuse unsafe patch'
          modified=original.replace(needle,replacement)
          path.write_text(modified)
          assert modified.count('"profiles/"')==1
          print('OSMAN_ANDROID_PROFILE_PATCH_OK')
          PY
      - name: Compile Android ARM64 with external main-pack overrides
        run: |
          set -euo pipefail
          scons -C .godot-engine -j4 platform=android target=template_debug arch=arm64 optimize=speed disable_path_overrides=no
          find .godot-engine/platform/android/java/lib/libs/debug -name libgodot_android.so -type f -print -quit | grep -q .
      - name: Build custom Android Godot AAR
        run: |
          set -euo pipefail
          cd .godot-engine/platform/android/java
          ./gradlew :lib:assembleTemplateDebug -x :lib:compileGodotNativeLibsTemplateDebugArm64 --no-daemon
          test -s lib/build/outputs/aar/godot-lib.template_debug.aar
          grep -Fq 'profiles/' lib/src/main/java/org/godotengine/godot/GodotIO.java
          mkdir -p "$GITHUB_WORKSPACE/android/app/libs"
          cp lib/build/outputs/aar/godot-lib.template_debug.aar "$GITHUB_WORKSPACE/android/app/libs/"
          unzip -l "$GITHUB_WORKSPACE/android/app/libs/godot-lib.template_debug.aar" | grep -q 'jni/arm64-v8a/libgodot_android.so'
      - name: Compile loader and run JVM tests
        run: |
          set -euo pipefail
          .godot-engine/platform/android/java/gradlew -p "$GITHUB_WORKSPACE/android" :app:assembleDebug :app:testDebugUnitTest --no-daemon
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgodot_android.so'
          sha256sum "$APK"
          mkdir -p dist
          cp "$APK" dist/OSMAN_Godot_Loader-debug.apk
      - name: Verify packaged file-manager intent association
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APK=dist/OSMAN_Godot_Loader-debug.apk
          "$SDK/build-tools/35.0.1/aapt" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/loader-manifest-tree.txt"
          grep -Fq 'android.intent.action.VIEW' "$RUNNER_TEMP/loader-manifest-tree.txt"
          grep -Fq 'android.intent.action.SEND' "$RUNNER_TEMP/loader-manifest-tree.txt"
          grep -Fq 'application/octet-stream' "$RUNNER_TEMP/loader-manifest-tree.txt"
          grep -Fq 'application/x-godot-pck' "$RUNNER_TEMP/loader-manifest-tree.txt"
          grep -Fq 'OSMAN Godot Loader' "$RUNNER_TEMP/loader-manifest-tree.txt"
          echo OSMAN_PCK_OPEN_WITH_MANIFEST_OK
      - name: Prepare release checksums
        if: success()
        run: |
          cd dist
          sha256sum OSMAN_Godot_Loader-debug.apk > SHA256SUMS.txt
      - name: Publish draft prerelease on explicit dispatch only
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]] || exit 1
          test ! -z "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing overwrite"
            exit 1
          fi
          gh release create "$TAG" dist/OSMAN_Godot_Loader-debug.apk dist/SHA256SUMS.txt \
            --title "Godot Loader $TAG" --draft --prerelease \
            --notes "Experimental ARM64 Android debug APK. Test thoroughly before publishing. Includes Godot Engine 4.6 (MIT)."
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OSMAN-Godot-Loader-Android
          path: |
            dist/OSMAN_Godot_Loader-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
