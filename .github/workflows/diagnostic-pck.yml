name: Diagnostic PCK v1 and v2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test-game/**'
      - '.github/workflows/diagnostic-pck.yml'
permissions:
  contents: read
jobs:
  test-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.6 with export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6-stable
          curl -fL --retry 3 "$BASE/Godot_v4.6-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v4.6-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable" /tmp/godot-tmpl dist
          unzip -q /tmp/templates.tpz -d /tmp/godot-tmpl
          cp /tmp/godot-tmpl/templates/* "$HOME/.local/share/godot/export_templates/4.6.stable/"
      - name: Produce two actual Godot PCK files
        shell: bash
        run: |
          set -euo pipefail
          for VERSION in v1 v2; do
            printf '%s\n' "$VERSION" > test-game/version.txt
            godot --headless --editor --path test-game --import --quit
            godot --headless --path test-game --export-pack Linux/X11 "$GITHUB_WORKSPACE/dist/Godot-Loader-Test-$VERSION.pck"
            test -s "dist/Godot-Loader-Test-$VERSION.pck"
            python3 - "$VERSION" <<'PY'
          import sys, pathlib
          p=pathlib.Path('dist/Godot-Loader-Test-'+sys.argv[1]+'.pck')
          assert p.read_bytes()[:4] == b'GDPC'
          print('OSMAN_TEST_PACK_OK',p.name,p.stat().st_size)
          PY
          done
          sha256sum dist/*.pck > dist/SHA256SUMS.txt
      - name: Run independent v1 and v2 boot smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/osman-test-one /tmp/osman-test-two
          (cd /tmp/osman-test-one && XDG_DATA_HOME=/tmp/osman-test-one/home godot --headless --main-pack "$GITHUB_WORKSPACE/dist/Godot-Loader-Test-v1.pck" -- --smoke | tee "$GITHUB_WORKSPACE/dist/v1-smoke.log")
          (cd /tmp/osman-test-two && XDG_DATA_HOME=/tmp/osman-test-two/home godot --headless --main-pack "$GITHUB_WORKSPACE/dist/Godot-Loader-Test-v2.pck" -- --smoke | tee "$GITHUB_WORKSPACE/dist/v2-smoke.log") || true
          grep -q 'OSMAN_LOADER_TEST_REPORT=' dist/v1-smoke.log
          grep -q '"migration_from_v1"' dist/v2-smoke.log
          # v2 MUST fail without migration. Passing unexpectedly would mean a false positive.
          grep -q '"status":"FAIL"' dist/v2-smoke.log
          echo OSMAN_DIAGNOSTIC_NEGATIVE_CONTROL_OK
          # Positive control: simulate explicit user-approved save copy (not the Android UI).
          SAVE_REL=godot/app_userdata/GodotLoaderDiagnostics
          mkdir -p "/tmp/osman-test-three/home/$SAVE_REL" /tmp/osman-test-three
          cp "/tmp/osman-test-one/home/$SAVE_REL/osman_loader_diag_save.json" "/tmp/osman-test-three/home/$SAVE_REL/"
          (cd /tmp/osman-test-three && XDG_DATA_HOME=/tmp/osman-test-three/home godot --headless --main-pack "$GITHUB_WORKSPACE/dist/Godot-Loader-Test-v2.pck" -- --smoke | tee "$GITHUB_WORKSPACE/dist/v2-with-migration-smoke.log")
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('dist')
          log=(root/'v2-with-migration-smoke.log').read_text()
          results=[json.loads(line.split('OSMAN_LOADER_TEST_REPORT=',1)[1]) for line in log.splitlines() if 'OSMAN_LOADER_TEST_REPORT=' in line]
          assert results,'missing diagnostic report'
          tests=results[-1]['tests']
          assert len(tests)==5 and all(t['status']=='PASS' for t in tests),tests
          assert {t['id'] for t in tests} >= {'migration_from_v1','save_read'}
          print('OSMAN_DIAGNOSTIC_POSITIVE_MIGRATION_OK',len(tests))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Godot-Loader-Diagnostic-PCK
          path: dist/
          if-no-files-found: error
